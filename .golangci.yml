version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this with the exclusions below
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback # deferred after Commit by design
  exclusions:
    presets:
      - std-error-handling # Close/Remove/print errors on read paths and cleanups
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
