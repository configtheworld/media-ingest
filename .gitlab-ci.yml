# GitLab CI: lint, tests, dependency scan and a multi-arch image pushed to
# the project's container registry (tags -> x.y.z + latest, default branch -> edge).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages: [lint, test, scan, build]

variables:
  GO_IMAGE: golang:1.26.9-bookworm
  GOPATH: $CI_PROJECT_DIR/.go

default:
  interruptible: true

.go-cache:
  cache:
    key: go-modules
    paths: [.go/pkg/mod]

go-lint:
  stage: lint
  image: golangci/golangci-lint:v2.14.0
  extends: .go-cache
  script:
    - unformatted="$(gofmt -l .)"; if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
    - go vet ./...
    - golangci-lint run ./...

go-test:
  stage: test
  image: $GO_IMAGE
  extends: .go-cache
  script:
    # Runs as root in the job container, so the chown-to-PUID tests run too.
    - go test -race -count=1 ./...

web-test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble # browsers match @playwright/test 1.63.0
  extends: .go-cache
  before_script:
    - curl -fsSL https://go.dev/dl/go1.26.9.linux-amd64.tar.gz | tar -C /usr/local -xz
    - export PATH=/usr/local/go/bin:$PATH
  script:
    - npm ci
    - npm run lint:js
    - npm run test:unit
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 1 week

govulncheck:
  stage: scan
  image: $GO_IMAGE
  extends: .go-cache
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

npm-audit:
  stage: scan
  image: node:22-bookworm-slim
  script:
    - npm audit --audit-level=high

image:
  stage: build
  image: docker:28
  services: [docker:28-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - docker buildx create --use --name ci
    - |
      push=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        version="${CI_COMMIT_TAG#v}"
        tags="-t $CI_REGISTRY_IMAGE:$version -t $CI_REGISTRY_IMAGE:latest"; push="--push"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        version="edge"; tags="-t $CI_REGISTRY_IMAGE:edge"; push="--push"
      else
        version="mr-$CI_MERGE_REQUEST_IID"; tags=""
      fi
      if [ -n "$push" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
      docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$version" $tags $push .
